<?xml version="1.0" encoding="UTF-8"?>
<!-- Icono de Digityzer: un disco con la etiqueta en rojo de grabación y, en la esquina, la onda
     del surco convertida en muestras (digitalización). Mismo estilo que Crate Digger y Vinyl
     Lab: baldosa redondeada, surcos y paleta Dracula (MIT). Diseño propio. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="sheen" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#44475a"/>
      <stop offset="1" stop-color="#191a21"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#282a36"/>
  <circle cx="60" cy="58" r="46" fill="url(#sheen)"/>
  <g fill="none" stroke="#6272a4" stroke-opacity="0.45" stroke-width="1.2">
    <circle cx="60" cy="58" r="41"/>
    <circle cx="60" cy="58" r="36"/>
    <circle cx="60" cy="58" r="31"/>
    <circle cx="60" cy="58" r="26"/>
  </g>
  <circle cx="60" cy="58" r="18" fill="#ff5555"/>
  <path d="M60 40 A18 18 0 0 1 78 58 L60 58 Z" fill="#ff79c6"/>
  <circle cx="60" cy="58" r="3.2" fill="#282a36"/>
  <!-- Muestras: la onda del surco hecha puntos discretos. -->
  <rect x="70" y="80" width="46" height="36" rx="10" fill="#21222c"/>
  <path d="M74 100 C80 86, 88 86, 93 98 S106 112, 112 98" fill="none" stroke="#8be9fd"
        stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#50fa7b" stroke-width="3" stroke-linecap="round">
    <line x1="78" y1="98" x2="78" y2="91"/>
    <line x1="86" y1="98" x2="86" y2="88"/>
    <line x1="94" y1="98" x2="94" y2="99"/>
    <line x1="102" y1="98" x2="102" y2="107"/>
    <line x1="110" y1="98" x2="110" y2="101"/>
  </g>
  <g fill="#50fa7b">
    <circle cx="78" cy="91" r="3"/>
    <circle cx="86" cy="88" r="3"/>
    <circle cx="94" cy="99" r="3"/>
    <circle cx="102" cy="107" r="3"/>
    <circle cx="110" cy="101" r="3"/>
  </g>
</svg>
